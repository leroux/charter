# One lockfile for the JavaScript in this repository: the root package holds
# the TypeScript compiler the gate's reader parses with, and vitest.
packages: []

catalogMode: strict
saveExact: true
catalog:
  typescript: 5.9.3
  vitest: 5.0.3

minimumReleaseAge: 1440
blockExoticSubdeps: true
strictPeerDependencies: true
allowBuilds:
  esbuild: true
